name: Fuzz
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./abi
            target: FuzzQuoteToProto
          - pkg: ./pcs
            target: FuzzPckCertificateExtensions
          - pkg: ./verify
            target: FuzzRawTdxQuote
    name: 'Fuzz ${{ matrix.target }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: 1.21.x
      - name: Run Go fuzz target
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        # Default minimization (up to 60s per input) would consume -fuzztime.
        run: go test "$PKG" -run='^$' -fuzz="^${TARGET}\$" -fuzztime=30s -fuzzminimizetime=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}/
